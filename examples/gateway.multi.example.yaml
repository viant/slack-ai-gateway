storage:
  driver: sqlite
  path: gateway-multi.sqlite

integrations:
  - name: steward
    transport: socket
    access_mode: shared_channel
    slack:
      app_id: A_STEWARD
      workspace_id: T_EXAMPLE
      channels:
        mode: selected
        allowlist: [C_CAMPAIGNS]
      status:
        mode: hybrid
        refresh_interval_sec: 30
      app_token_secret:
        URL: /absolute/path/steward-app-token.enc
        Key: blowfish://default
      bot_token_secret:
        URL: /absolute/path/steward-bot-token.enc
        Key: blowfish://default
    access:
      defaults:
        users:
          mode: channel_members
      direct_messages:
        users:
          mode: members_only
          allowlist: [U_EXAMPLE]
    backend:
      type: agently
      base_url: https://agently.example.com
      principal_id: shared-steward
      agent_id: steward
      auth:
        mode: oob_session
        secret:
          URL: /absolute/path/agently.enc
          Key: blowfish://default

  - name: support
    transport: socket
    access_mode: shared_channel
    slack:
      app_id: A_SUPPORT
      workspace_id: T_EXAMPLE
      channels:
        mode: selected
        allowlist: [C_SUPPORT]
      status:
        mode: message
      app_token_secret:
        URL: /absolute/path/support-app-token.enc
        Key: blowfish://default
      bot_token_secret:
        URL: /absolute/path/support-bot-token.enc
        Key: blowfish://default
    access:
      defaults:
        users:
          mode: channel_members
    backend:
      type: agui
      endpoint: http://127.0.0.1:9292/v1/ag-ui/run
      principal_id: support-service
      auth:
        mode: none
      # For an authenticated server use HTTPS, mode: bearer and a Scy secret.
