# Copy to ~/.slack-ai-gateway/config/gateway.local.yaml and replace placeholders.
# Create the config and database directories first; see ../README.md.
# Both user scopes require users:read. Reinstall the Slack app after adding scopes.
storage:
  driver: sqlite
  path: ../db/gateway.sqlite

integrations:
  - name: steward
    transport: socket
    slack:
      app_id: A_TEST
      workspace_id: T_TEST
      app_token_secret:
        URL: file:///absolute/path/slack-app-token.enc
        Key: blowfish://default
      bot_token_secret:
        URL: file:///absolute/path/slack-bot-token.enc
        Key: blowfish://default
      response:
        # raw, cli_compatible, summary, normalized_summary, or report_text.
        # Already-persisted answer parts keep their original content on retry.
        mode: raw
      status:
        # message, agent_session, or hybrid. Existing jobs keep their saved mode.
        mode: message
        refresh_interval_sec: 30
    backend:
      type: agently
      base_url: http://127.0.0.1:9191
      agent_id: steward
      principal_id: shared-steward
      auth:
        mode: oob_session
        secret:
          URL: file:///absolute/path/agently-service.json
          Key: blowfish://default
    access:
      channels:
        enabled: true
        scope: selected
        allowlist: [C_TEST]
        allow_private: false
        users:
          scope: workspace_members_only
      direct_messages:
        enabled: false
