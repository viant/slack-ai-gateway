display_information:
  name: Steward
  description: Shared troubleshooting assistant
  background_color: "#16324f"
features:
  bot_user:
    display_name: Steward
    always_online: false
  agent_view:
    agent_description: Steward helps investigate issues and answer questions using Agently.
    suggested_prompts:
      - title: What can you help me with?
        message: What can you help me with?
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:read
      - users:read
      - groups:read
      - im:read
      - im:history
      - assistant:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - app_home_opened
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
