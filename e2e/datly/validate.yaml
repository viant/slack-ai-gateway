init:
  - name: projectRoot
    when: $params.projectRoot
    value: $params.projectRoot
    else: $WorkingDirectory(../..)
  - name: mysqlCred
    when: $params.mysqlCred
    value: $params.mysqlCred
    else: mysql-e2e.json
  - name: discoveryDriver
    when: $params.driver
    value: $params.driver
    else: mysql
  - name: discoveryDSN
    when: $params.dsn
    value: $params.dsn
    else: $env.AGENTLY_SLACK_MYSQL_DSN

pipeline:
  prerequisites:
    action: exec:run
    checkError: true
    commands:
      - command -v datly
      - command -v go

  credentials:
    when: $discoveryDSN = ''
    action: exec:run
    checkError: true
    secrets:
      gatewayMySQLCredentials: $mysqlCred
    commands:
      - export AGENTLY_SLACK_DISCOVERY_DSN='${gatewayMySQLCredentials.username}:${gatewayMySQLCredentials.password}@tcp(127.0.0.1:3309)/agently_steward_slack?parseTime=true'

  connection:
    when: $discoveryDSN != ''
    action: exec:run
    checkError: true
    commands:
      - export AGENTLY_SLACK_DISCOVERY_DSN='$discoveryDSN'

  validate:
    action: exec:run
    TimeoutMs: 600000
    checkError: true
    commands:
      - cd '$projectRoot'
      - datly validate -dir . -schema -connector slack -driver '$discoveryDriver' -dsn="$AGENTLY_SLACK_DISCOVERY_DSN" -format json github.com/viant/agently-slack-gateway/dql/...
