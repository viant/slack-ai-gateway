# Slack-only test fixture with a fake backend; not a runtime configuration.
# Copy outside the repository before opting into a live test; see ../README.md.
storage:
  driver: sqlite
  path: slack-smoke.sqlite
transport: socket
access_mode: shared_channel
slack:
  status:
    # message (default): phase/time; agent_session: native indicator; hybrid: both.
    # Restart at any time; existing questions keep their mode. See ../../../docs/request-status.md.
    mode: message
    # Message refresh in message/hybrid: periodic status refresh in whole seconds (default: 30; must be positive).
    # One setting for the gateway; changes require restart.
    # Phase changes and completion are published independently.
    refresh_interval_sec: 30
  app_id: A_REPLACE_ME
  workspace_id: T_REPLACE_ME
  channels:
    mode: selected
    allowlist: [C_REPLACE_ME]
    allow_private: false
  app_token_env: SLACK_APP_TOKEN
  bot_token_env: SLACK_BOT_TOKEN
access:
  channel_overrides:
    C_REPLACE_ME:
      users:
        mode: channel_members
# Agently is intentionally absent: the test alone injects a fake shared backend.
