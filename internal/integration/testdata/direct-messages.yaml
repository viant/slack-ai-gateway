# Dedicated DM-only live-smoke configuration with a fake backend.
# Copy outside the repository before opting into a live test; see ../README.md.
storage:
  driver: sqlite
  path: slack-smoke.sqlite
integrations:
  - name: smoke
    transport: socket
    access:
      channels:
        enabled: false
      direct_messages:
        enabled: true
        users:
          scope: workspace_members_and_guests
    slack:
      app_id: A_REPLACE_ME
      workspace_id: T_REPLACE_ME
      app_token_secret:
        URL: file:///absolute/path/slack-app-token.enc
        Key: blowfish://default
      bot_token_secret:
        URL: file:///absolute/path/slack-bot-token.enc
        Key: blowfish://default
      status:
        mode: message
        refresh_interval_sec: 30
    backend:
      type: agently
      base_url: https://smoke.example.test
      agent_id: slack-smoke
      principal_id: slack-smoke-shared
      auth:
        mode: oob_session
        secret: {URL: /unused/smoke-oob.json, Key: 'blowfish://default'}
